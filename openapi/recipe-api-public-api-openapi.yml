          type: array
          items:
            type: string
          example:
          - USDA FoodData Central
    Equipment:
      type: object
      properties:
        name:
          type: string
          example: Stand mixer
        required:
          type: boolean
        alternative:
          type:
          - string
          - 'null'
          example: Hand mixer
    IngredientGroup:
      type: object
      properties:
        group_name:
          type: string
          example: For the dough
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
    Dietary:
      type: object
      properties:
        flags:
          type: array
          items:
            type: string
          example:
          - Vegetarian
          - Gluten-Free
        not_suitable_for:
          type: array
          items:
            type: string
          example:
          - Nut allergy
    Storage:
      type: object
      properties:
        refrigerator:
          type:
          - object
          - 'null'
          properties:
            duration:
              type: string
              description: ISO 8601 duration
              example: P3D
            notes:
              type: string
        freezer:
          type:
          - object
          - 'null'
          properties:
            duration:
              type: string
              description: ISO 8601 duration
              example: P2M
            notes:
              type: string
        reheating:
          type:
          - string
          - 'null'
        does_not_keep:
          type: boolean
    Troubleshooting:
      type: object
      properties:
        symptom:
          type: string
          example: Dough too sticky
        likely_cause:
          type: string
          example: Too much water or humidity
        prevention:
          type: string
          example: Add flour gradually, check humidity
        fix:
          type: string
          example: Dust with flour while kneading
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key in format `rapi_<key>`
