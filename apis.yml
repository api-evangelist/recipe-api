aid: recipe-api
url: https://raw.githubusercontent.com/api-evangelist/recipe-api/refs/heads/main/apis.yml
name: Recipe API
description: Recipe API is a B2B recipe and nutrition API providing structured recipes with comprehensive,
  USDA-backed nutrition data — 32 nutrients per recipe, structured preparation steps, and per-100g nutrition
  on individual ingredients. Beyond browsing and filtering an existing catalog by category, cuisine, dietary
  flag and macro, it will generate a new recipe with nutrition on demand, and generate food photography
  from a recipe. It positions itself as a lighter-weight alternative for developers who want clean recipe
  data without much setup, and publishes both an llms.txt and an official MCP server so that AI clients
  can use it directly. Self-serve from a free evaluation tier through to a paid scale tier, with a documented
  keyless quick-start call so a developer can try the API before signing up.
